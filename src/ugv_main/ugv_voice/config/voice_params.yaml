# Voice stack parameters. Device names are the UGV Beast's verified hardware
# (2026-08-14): capture = USB camera mic, playback = built-in audio board.
# ALSA card *names* are stable across boots; indices are not.
# On the x86 dev machine override both to that machine's devices.

voice_ear:
  ros__parameters:
    capture_device: "Camera"          # PortAudio name substring
    sample_rate: 16000
    listen_window_s: 6.0
    silence_after_speech_s: 0.6       # turn ends sooner; <0.5 clips mid-sentence pauses
    energy_threshold: 0.015
    asr_model: "base.en"
    models_dir: "/home/ws/ugv_ws/models"
    wake_word_enabled: false          # push-to-talk until PTT is proven
    wake_word_model: "hey_jarvis"
    wake_word_threshold: 0.6
    record_max_s: 15.0                # voice/record service hard cap (tool clamps to 3–15)

# Scripted safe mode (voice.launch.py) — no LLM.
voice_brain:
  ros__parameters:
    brain_backend: "rules"
    speak_before_act_s: 1.2           # speak-then-act reaction window
    confirm_timeout_s: 15.0
    max_motions_per_minute: 12

# Chat-with-tools (chat.launch.py, the primary voice stack). The LLM
# converses freely and proposes tool calls; every call is validated and
# clamped (tools.py -> intent_schema) before behavior_ctrl sees it.
# Requires the host's Ollama daemon (voice_control_plan.md Phase 2 setup)
# with a tool-capable model pulled.
voice_chat:
  ros__parameters:
    ollama_url: "http://localhost:11434"  # host daemon; container shares its network
    ollama_model: "granite4:3b"           # tool-capable; qwen2.5:3b-instruct-q4_K_M fallback
    request_timeout_s: 120.0              # first turn includes model load
    connect_timeout_s: 5.0                # daemon unreachable -> RuleBrain fallback
    keep_alive: "10m"                     # auto-unload after 10 min idle
    temperature: 0.7
    max_reply_tokens: 120                 # keeps spoken replies short
    max_history_turns: 12
    system_prompt: ""                     # "" = built-in honest-machine persona
    auto_listen: true                     # re-arm the mic after each reply
    relisten_delay_s: 0.4                 # mic re-arms speaking_grace_s + this after speech
    max_silent_turns: 2                   # empty listens before the session ends
    tools_enabled: true                   # false = talk-only (no tool schemas sent)
    max_tool_rounds: 3                    # tool rounds per user turn; last round is prose-only
    speak_before_act_s: 1.2               # speak-then-act reaction window
    confirm_timeout_s: 15.0               # go_to_point verbal-yes window
    max_motions_per_minute: 12
    offline_fallback: true                # LLM down -> RuleBrain basic commands
    recordings_dir: "/tmp/ugv_voice_recordings"  # record_replay temp wavs; swept on start/session end

voice_mouth:
  ros__parameters:
    playback_device: "plughw:CARD=Device,DEV=0"
    tts_backend: "auto"               # piper once its model is fetched, else espeak-ng
    piper_model: "/home/ws/ugv_ws/models/piper/en_US-lessac-medium.onnx"
    espeak_voice: "en-us"
    espeak_speed: 155
    speaking_grace_s: 0.4             # /voice/speaking stays True this long after audio ends
